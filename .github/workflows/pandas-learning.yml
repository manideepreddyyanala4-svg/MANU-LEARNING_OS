name: Verify Pandas learning code examples

on:
  pull_request:
    paths:
      - 'lib/pandas-*.ts'
      - 'scripts/test_pandas_references.py'
      - 'app/roadmap/pandas/**'
      - 'app/roadmap/page.tsx'
      - '.github/workflows/pandas-learning.yml'
  push:
    branches: [main]
    paths:
      - 'lib/pandas-*.ts'
      - 'scripts/test_pandas_references.py'
      - 'app/roadmap/pandas/**'
      - 'app/roadmap/page.tsx'

permissions:
  contents: read

jobs:
  verify-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install isolated data science dependencies
        run: |
          python3 -m venv .venv-pandas-audit
          .venv-pandas-audit/bin/python -m pip install --disable-pip-version-check pandas==2.3.3 numpy==2.3.5 openpyxl==3.1.5 matplotlib==3.10.7
      - name: Verify Python code, real outputs and explanations
        run: .venv-pandas-audit/bin/python scripts/test_pandas_references.py
