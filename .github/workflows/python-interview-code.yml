name: Verify Python Coding Interviews reference examples

on:
  pull_request:
    paths:
      - 'lib/python-interview-*.ts'
      - 'scripts/test_python_interview_references.py'
      - 'app/roadmap/python-interviews/**'
      - 'app/roadmap/page.tsx'
      - '.github/workflows/python-interview-code.yml'
  push:
    branches: [main]
    paths:
      - 'lib/python-interview-*.ts'
      - 'scripts/test_python_interview_references.py'
      - 'app/roadmap/python-interviews/**'
      - 'app/roadmap/page.tsx'

permissions:
  contents: read

jobs:
  verify-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test Python source and expected outputs
        run: python3 scripts/test_python_interview_references.py
