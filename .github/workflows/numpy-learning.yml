name: Verify NumPy learning code examples

on:
  pull_request:
    paths:
      - 'lib/numpy-*.ts'
      - 'scripts/test_numpy_references.py'
      - 'app/roadmap/numpy/**'
      - 'app/roadmap/page.tsx'
      - '.github/workflows/numpy-learning.yml'
  push:
    branches: [main]
    paths:
      - 'lib/numpy-*.ts'
      - 'scripts/test_numpy_references.py'
      - 'app/roadmap/numpy/**'
      - 'app/roadmap/page.tsx'

permissions:
  contents: read

jobs:
  verify-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create isolated environment and install NumPy
        run: |
          python3 -m venv .venv-numpy-audit
          .venv-numpy-audit/bin/python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Run and match all NumPy examples
        run: .venv-numpy-audit/bin/python scripts/test_numpy_references.py
